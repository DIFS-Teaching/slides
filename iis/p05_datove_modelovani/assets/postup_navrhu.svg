<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1000 400"
   width="1000"
   height="400"
   font-family="sans-serif"
   font-size="15"
   fill="#1f2937"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
    <marker id="arr-rev" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#4b5563" />
    </marker>
    <marker id="arr-hl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c" />
    </marker>
  </defs>

  <!-- ── Požadavky ───────────────────────────────────────────── -->
  <rect x="10" y="110" width="170" height="120" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8" />
  <text x="95" y="138" text-anchor="middle" font-weight="bold" fill="#0c4a6e" font-size="17">Požadavky</text>
  <line x1="24" y1="148" x2="166" y2="148" stroke="#0284c7" stroke-width="1" />
  <text x="95" y="172" text-anchor="middle">diagram případů</text>
  <text x="95" y="190" text-anchor="middle">užití</text>
  <text x="95" y="214" text-anchor="middle">+ scénáře</text>

  <!-- ── Analýza ─────────────────────────────────────────────── -->
  <rect x="220" y="10" width="300" height="330" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8" />
  <text x="370" y="36" text-anchor="middle" font-weight="bold" fill="#0c4a6e" font-size="17">Analýza</text>

  <!-- Statická analýza (zvýrazněno) -->
  <rect x="240" y="55" width="260" height="120" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5" rx="6" />
  <text x="370" y="84" text-anchor="middle" font-weight="bold" fill="#9a3412" font-size="16">Statická analýza</text>
  <text x="370" y="112" text-anchor="middle">diagram tříd</text>
  <text x="370" y="132" text-anchor="middle">(doménový model)</text>
  <text x="370" y="160" text-anchor="middle" font-style="italic" fill="#6b7280" font-size="13">struktura: co v systému je</text>

  <!-- Dynamická analýza -->
  <rect x="240" y="200" width="260" height="120" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" rx="6" />
  <text x="370" y="229" text-anchor="middle" font-weight="bold" fill="#0c4a6e" font-size="16">Dynamická analýza</text>
  <text x="370" y="257" text-anchor="middle">sekvenční, aktivitní,</text>
  <text x="370" y="277" text-anchor="middle">stavové diagramy</text>
  <text x="370" y="305" text-anchor="middle" font-style="italic" fill="#6b7280" font-size="13">chování: jak to funguje</text>

  <!-- iterace statická ↔ dynamická -->
  <line x1="370" y1="178" x2="370" y2="197" stroke="#4b5563" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)" />
  <text x="380" y="192" fill="#4b5563" font-size="12">iterace</text>

  <!-- ── Návrh ───────────────────────────────────────────────── -->
  <rect x="560" y="10" width="220" height="330" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8" />
  <text x="670" y="36" text-anchor="middle" font-weight="bold" fill="#0c4a6e" font-size="17">Návrh</text>

  <rect x="578" y="55" width="184" height="70" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" rx="6" />
  <text x="670" y="85" text-anchor="middle">architektura</text>
  <text x="670" y="106" text-anchor="middle" fill="#6b7280" font-size="13">(vrstvy, MVC)</text>

  <rect x="578" y="140" width="184" height="80" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5" rx="6" />
  <text x="670" y="174" text-anchor="middle" font-weight="bold" fill="#9a3412">schéma databáze</text>
  <text x="670" y="196" text-anchor="middle" fill="#6b7280" font-size="13">(produkční model)</text>

  <rect x="578" y="235" width="184" height="85" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" rx="6" />
  <text x="670" y="270" text-anchor="middle">rozhraní</text>
  <text x="670" y="292" text-anchor="middle" fill="#6b7280" font-size="13">(API, uživatelské rozhraní)</text>

  <!-- ── Implementace, testování ─────────────────────────────── -->
  <rect x="820" y="55" width="170" height="110" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8" />
  <text x="905" y="105" text-anchor="middle" font-weight="bold" fill="#0c4a6e" font-size="17">Implementace</text>
  <text x="905" y="128" text-anchor="middle" fill="#6b7280" font-size="13">(DB, ORM, kód)</text>

  <rect x="820" y="200" width="170" height="110" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8" />
  <text x="905" y="250" text-anchor="middle" font-weight="bold" fill="#0c4a6e" font-size="17">Testování</text>
  <text x="905" y="273" text-anchor="middle" fill="#6b7280" font-size="13">(a nasazení)</text>

  <!-- ── Hlavní tok ──────────────────────────────────────────── -->
  <line x1="182" y1="170" x2="217" y2="170" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)" />
  <line x1="522" y1="300" x2="557" y2="300" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)" />
  <line x1="782" y1="110" x2="817" y2="110" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)" />
  <line x1="905" y1="167" x2="905" y2="197" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)" />

  <!-- Zvýrazněná cesta: statická analýza → schéma DB -->
  <path d="M 502 115 L 540 115 L 540 180 L 575 180" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arr-hl)" />

  <!-- Štítky "dnes" -->
  <rect x="446" y="44" width="52" height="22" fill="#ea580c" rx="11" />
  <text x="472" y="60" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="13">dnes</text>
  <rect x="708" y="129" width="52" height="22" fill="#ea580c" rx="11" />
  <text x="734" y="145" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="13">dnes</text>

  <!-- ── Zpětná vazba: ověření podle případů užití ───────────── -->
  <path d="M 905 312 L 905 375 L 95 375 L 95 233" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)" />
  <rect x="380" y="364" width="240" height="22" fill="#ffffff" />
  <text x="500" y="380" text-anchor="middle" fill="#4b5563" font-size="13" font-style="italic">ověření podle případů užití</text>
</svg>
