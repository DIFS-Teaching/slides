<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   viewBox="0 0 880 510"
   width="880"
   height="510"
   font-family="sans-serif"
   font-size="17"
   fill="#1f2937"
   version="1.1">
  <defs>
    <!-- Třída: jméno + dva prázdné oddíly (atributy, operace) -->
    <g id="cls">
      <rect x="0" y="0" width="180" height="72" fill="#0365c0" stroke="#013260" stroke-width="2.5" />
      <line x1="0" y1="34" x2="180" y2="34" stroke="#013260" stroke-width="2.5" />
      <line x1="0" y1="53" x2="180" y2="53" stroke="#013260" stroke-width="2.5" />
    </g>
  </defs>

  <!-- ── Generalizace (hollow triangle u předka) ───────────────── -->
  <g fill="none" stroke="#c00000" stroke-width="2.5">
    <!-- Asistent, Profesor → Zaměstnanec -->
    <path d="M 510,180 V 140 H 770 V 300" />
    <path d="M 750,102 V 140" />
    <!-- Asistent → Student -->
    <path d="M 420,216 H 120 V 400" />
  </g>
  <g fill="#ffffff" stroke="#c00000" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="750,82 738,102 762,102" />
    <polygon points="120,420 108,400 132,400" />
  </g>

  <!-- ── Asociace ──────────────────────────────────────────────── -->
  <g fill="none" stroke="#000000" stroke-width="2">
    <!-- prerekvizita (Kurz – Kurz) -->
    <path d="M 220,50 V 22 H 140 V 86 H 180" />
    <!-- má části (Kurz – Část) -->
    <path d="M 300,122 L 440,420" />
    <!-- asistuje (Asistent – Část) -->
    <path d="M 510,252 V 420" />
    <!-- vyučuje (Profesor – Část) -->
    <path d="M 680,360 L 580,444" />
    <!-- je zapsán (Student – Část) -->
    <path d="M 210,456 H 400" />
  </g>

  <!-- Názvy asociací a rolí -->
  <g font-size="20">
    <text x="134" y="62" text-anchor="end" font-style="italic">prerekvizita</text>
    <text x="386" y="270">má části</text>
    <text x="520" y="342">asistuje</text>
    <text x="642" y="418">vyučuje</text>
    <text x="305" y="447" text-anchor="middle">je zapsán</text>
  </g>

  <!-- Multiplicity -->
  <g font-size="17">
    <text x="226" y="42">0..*</text>
    <text x="146" y="104">0..*</text>
    <text x="316" y="142">1</text>
    <text x="446" y="408">0..*</text>
    <text x="518" y="272">0..*</text>
    <text x="518" y="412">0..*</text>
    <text x="662" y="352" text-anchor="end">1</text>
    <text x="590" y="474">0..*</text>
    <text x="216" y="476">0..*</text>
    <text x="394" y="476" text-anchor="end">0..*</text>
  </g>

  <!-- ── Třídy ─────────────────────────────────────────────────── -->
  <g fill="#ffffff" font-size="22" text-anchor="middle">
    <use href="#cls" x="180" y="50" />
    <text x="270" y="74">Kurz</text>

    <use href="#cls" x="660" y="10" />
    <text x="750" y="34">Zaměstnanec</text>

    <use href="#cls" x="420" y="180" />
    <text x="510" y="204">Asistent</text>

    <use href="#cls" x="680" y="300" />
    <text x="770" y="324">Profesor</text>

    <use href="#cls" x="30" y="420" />
    <text x="120" y="444">Student</text>

    <use href="#cls" x="400" y="420" />
    <text x="490" y="444">Část</text>
  </g>
</svg>
