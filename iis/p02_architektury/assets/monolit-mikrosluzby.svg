  <text x="714" y="340" text-anchor="middle" font-weight="bold" fill="#1e3a8a" font-size="13">DB</text>
  <path d="M784,300 v60 a36,10 0 0 0 72,0 v-60" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="820" cy="300" rx="36" ry="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="820" y="340" text-anchor="middle" font-weight="bold" fill="#14532d" font-size="13">DB</text>
  <path d="M890,300 v60 a36,10 0 0 0 72,0 v-60" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
