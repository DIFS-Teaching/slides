  <rect x="120" y="478" width="30" height="16" fill="#f8fafc" stroke="#475569" stroke-width="2" rx="4"/>
  <text x="158" y="491" fill="#374151" font-size="13">jednotka nasazení (proces, kontejner)</text>
  <line x1="430" y1="486" x2="470" y2="486" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <text x="478" y="491" fill="#374151" font-size="13">volání v rámci procesu</text>
  <line x1="680" y1="486" x2="720" y2="486" stroke="#4b5563" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="728" y="491" fill="#374151" font-size="13">volání po síti</text>
