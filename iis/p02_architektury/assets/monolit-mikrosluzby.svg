  <line x1="926" y1="252" x2="926" y2="289" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── Popisky ─────────────────────────────────────────────── -->
  <text x="160" y="402" text-anchor="middle" font-weight="bold" fill="#0f172a" font-size="15">1 nasazení, 1 databáze</text>
  <text x="160" y="424" text-anchor="middle" fill="#374151" font-size="13">členění jen na technické vrstvy</text>
  <text x="160" y="444" text-anchor="middle" fill="#374151" font-size="13">oblasti propletené napříč kódem</text>

  <text x="490" y="402" text-anchor="middle" font-weight="bold" fill="#0f172a" font-size="15">1 nasazení, 1 databáze</text>
  <text x="490" y="424" text-anchor="middle" fill="#374151" font-size="13">moduly podle oblastí, vlastní data</text>
  <text x="490" y="444" text-anchor="middle" fill="#374151" font-size="13">volání přes rozhraní v procesu</text>

  <text x="820" y="402" text-anchor="middle" font-weight="bold" fill="#0f172a" font-size="15">N nasazení, N databází</text>
  <text x="820" y="424" text-anchor="middle" fill="#374151" font-size="13">služby podle oblastí, vlastní data</text>
  <text x="820" y="444" text-anchor="middle" fill="#374151" font-size="13">volání po síti (HTTP, zprávy)</text>

  <!-- ── Legenda ─────────────────────────────────────────────── -->
