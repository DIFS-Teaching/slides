<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>kraje.json</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/googlecode.min.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: white;
  }
  pre {
    margin: 0;
    height: 100%;
    box-sizing: border-box;
  }
  pre code.hljs {
    height: 100%;
    box-sizing: border-box;
    overflow: auto;
    font-family: Courier, "Courier New", monospace;
    font-size: 1.4rem;
    line-height: 1.3;
  }
</style>
</head>
<body>
<pre><code id="json" class="language-json">Načítám data…</code></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/languages/json.min.js"></script>
<script>
  fetch('kraje.json')
    .then(function (response) { return response.text(); })
    .then(function (text) {
      var el = document.getElementById('json');
      el.textContent = text;
      hljs.highlightElement(el);
    })
    .catch(function (err) {
      document.getElementById('json').textContent = 'Chyba při načítání kraje.json: ' + err;
    });
</script>
</body>
</html>
