<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Tutorial -- 1. bodová mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // KROK 1: základ -- mapa s bodovým markerem pro každou školu
  const map = L.map('map');

  // podkladová vrstva (OpenStreetMap dlaždice)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // načtení dat -- pokud stránka běží vložená v prezentaci, cesta je vůči jejímu kořeni;
  // pokud je stránka otevřená přímo (staženou kostru), zkusí se cesta vůči tomuto souboru
  function fetchData(pathFromRoot, pathFromFile) {
    return fetch(pathFromRoot).then(r => r.ok ? r : fetch(pathFromFile));
  }

  // načtení škol a vykreslení bodové mapy
  fetchData('assets/data/schools.json', '../data/schools.json')
    .then(response => response.json())
    .then(data => {
      const schools = data.schools.filter(s => s.lat && s.lon);

      const markers = schools.map(s =>
        L.marker([s.lat, s.lon]).bindPopup(`<b>${s.schoolName}</b><br>Počet studentů: ${s.value}`)
      );

      const layer = L.featureGroup(markers).addTo(map);

      // přiblížení mapy na hranice všech škol
      map.fitBounds(layer.getBounds(), { padding: [20, 20] });
    });
</script>
</body>
</html>
