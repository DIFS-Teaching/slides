<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Tutorial -- 2. hodnoty na markeru</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; }

  /* NOVÉ v kroku 2: kruhový marker s číslem uprostřed */
  .value-marker {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #5b9bd5;
    color: white;
    border: 2px solid white;
    box-shadow: 0 0 3px rgba(0, 0, 0, .5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
  }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map');

  // podkladová vrstva (OpenStreetMap dlaždice)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // NOVÉ v kroku 2: ikona -- kruh s číslem "value" uprostřed (místo výchozí špendlíkové ikony)
  function valueIcon(value) {
    return L.divIcon({
      className: '',
      html: `<div class="value-marker">${value}</div>`,
      iconSize: [30, 30]
    });
  }

  // načtení dat -- pokud stránka běží vložená v prezentaci, cesta je vůči jejímu kořeni;
  // pokud je stránka otevřená přímo (staženou kostru), zkusí se cesta vůči tomuto souboru
  function fetchData(pathFromRoot, pathFromFile) {
    return fetch(pathFromRoot).then(r => r.ok ? r : fetch(pathFromFile));
  }

  // načtení škol a vykreslení bodové mapy
  fetchData('assets/data/schools.json', '../data/schools.json')
    .then(response => response.json())
    .then(data => {
      const schools = data.schools.filter(s => s.lat && s.lon);

      // NOVÉ v kroku 2: marker používá icon: valueIcon(...) místo výchozí ikony
      const markers = schools.map(s =>
        L.marker([s.lat, s.lon], { icon: valueIcon(s.value) })
          .bindPopup(`<b>${s.schoolName}</b><br>Počet studentů: ${s.value}`)
      );

      const layer = L.featureGroup(markers).addTo(map);

      // přiblížení mapy na hranice všech škol
      map.fitBounds(layer.getBounds(), { padding: [20, 20] });
    });
</script>
</body>
</html>
