<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Leaflet -- příklad</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // bod reprezentující školu -- VUT FIT
  const fit = { name: "VUT FIT", lat: 49.226907, lon: 16.596896 };

  // vytvoření mapy vycentrované na bod školy
  const map = L.map('map').setView([fit.lat, fit.lon], 18);

  // podkladová vrstva (OpenStreetMap dlaždice)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // marker reprezentující školu
  L.marker([fit.lat, fit.lon])
    .addTo(map)
    .bindPopup(`<b>${fit.name}</b>`)
    .openPopup();
</script>
</body>
</html>
