<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Leaflet -- podkladové mapy</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // bod reprezentující školu -- VUT FIT
  const fit = { name: "VUT FIT", lat: 49.226907, lon: 16.596896 };

  // vytvoření mapy vycentrované na bod školy
  const map = L.map('map').setView([fit.lat, fit.lon], 17);

  // podkladové vrstvy
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  });

  const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors, SRTM | &copy; OpenTopoMap'
  }).addTo(map);

  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri'
  });

  // ovládací prvek pro přepínání podkladových vrstev
  L.control.layers({
    "OpenStreetMap": osm,
    "OpenTopoMap": topo,
    "Satelitní snímky": satellite
  }).addTo(map);

  // marker reprezentující školu
  L.marker([fit.lat, fit.lon])
    .addTo(map)
    .bindPopup(`<b>${fit.name}</b>`)
    .openPopup();
</script>
</body>
</html>
