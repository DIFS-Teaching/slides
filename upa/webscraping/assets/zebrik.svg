<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1000 425" width="1000" height="425"
     font-family="sans-serif" font-size="14" fill="#1f2937"
     version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Osa: roste úsilí -->
  <line x1="58" y1="45" x2="58" y2="408" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <text transform="translate(34,226) rotate(-90)" text-anchor="middle" font-size="15" font-style="italic" fill="#4b5563">roste úsilí, klesá spolehlivost</text>

  <!-- 1. Otevřená data -->
  <g>
    <rect x="110" y="45" width="600" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="132" y="68" font-weight="bold" font-size="17" fill="#14532d">Otevřená data, datová sada, dump</text>
    <text x="132" y="87" font-size="12.5" fill="#166534">stáhnu soubor a mám hotovo</text>
  </g>
  <text x="730" y="76" font-size="13" font-style="italic" fill="#6b7280">nic neprogramujte</text>

  <!-- 2. API -->
  <g>
    <rect x="110" y="107" width="600" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="132" y="130" font-weight="bold" font-size="17" fill="#14532d">Dokumentované API</text>
    <text x="132" y="149" font-size="12.5" fill="#166534">jeden HTTP dotaz, zpět JSON nebo XML</text>
  </g>
  <text x="730" y="138" font-size="13" font-style="italic" fill="#6b7280">sekce Alternativy</text>

  <!-- 3. Anotace v HTML -->
  <g>
    <rect x="110" y="169" width="600" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="132" y="192" font-weight="bold" font-size="17" fill="#0c4a6e">Strukturovaná anotace v HTML</text>
    <text x="132" y="211" font-size="12.5" fill="#0369a1">JSON-LD, RDFa &#8211; data i jejich význam</text>
  </g>
  <text x="730" y="200" font-size="13" font-style="italic" fill="#6b7280">konec dneška a příští týden</text>

  <!-- 4. Statické HTML -->
  <g>
    <rect x="110" y="231" width="600" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="132" y="254" font-weight="bold" font-size="17" fill="#78350f">Statické HTML</text>
    <text x="132" y="273" font-size="12.5" fill="#b45309">parser, CSS selektory, XPath</text>
  </g>
  <text x="730" y="262" font-size="13" font-style="italic" fill="#6b7280">sekce Modely dokumentů</text>

  <!-- 5. HTML z JavaScriptu -->
  <g>
    <rect x="110" y="293" width="600" height="52" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="132" y="316" font-weight="bold" font-size="17" fill="#7c2d12">HTML poskládané JavaScriptem</text>
    <text x="132" y="335" font-size="12.5" fill="#c2410c">musím spustit celý prohlížeč</text>
  </g>
  <text x="730" y="324" font-size="13" font-style="italic" fill="#6b7280">sekce Automatizace prohlížeče</text>

  <!-- 6. Anti-bot -->
  <g>
    <rect x="110" y="355" width="600" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="132" y="378" font-weight="bold" font-size="17" fill="#7f1d1d">Přihlášení a anti-bot obrana</text>
    <text x="132" y="397" font-size="12.5" fill="#b91c1c">relace, tokeny, CAPTCHA, Cloudflare</text>
  </g>
  <text x="730" y="386" font-size="13" font-style="italic" fill="#6b7280">tady se ptejte, jestli vůbec</text>
</svg>
