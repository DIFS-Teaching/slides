<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1000 340" width="1000" height="340"
     font-family="sans-serif" font-size="14" fill="#1f2937"
     version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Společné zadání -->
  <rect x="330" y="10" width="340" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="500" y="39" text-anchor="middle" font-weight="bold" font-size="17" fill="#374151">Chci strukturovaná data z webu</text>

  <path d="M 400 58 L 255 88" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 600 58 L 745 88" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Levý pól: scraping -->
  <g>
    <rect x="50" y="95" width="410" height="180" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="255" y="126" text-anchor="middle" font-weight="bold" font-size="20" fill="#0c4a6e">Data si vezmu</text>
    <text x="255" y="150" text-anchor="middle" font-size="13" fill="#0369a1">HTTP, DOM, selektory, prohlížeč, LLM</text>
    <text x="74" y="181" font-size="14" fill="#16a34a">+ funguje na libovolném webu</text>
    <text x="74" y="206" font-size="14" fill="#dc2626">− rozbije se, až web změní vzhled</text>
    <text x="74" y="231" font-size="14" fill="#dc2626">− data bez významu, jen text v tabulce</text>
    <text x="255" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#0284c7">přednáška 1 &#8211; dnes</text>
  </g>

  <!-- Pravý pól: propojená data -->
  <g>
    <rect x="540" y="95" width="410" height="180" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="745" y="126" text-anchor="middle" font-weight="bold" font-size="20" fill="#14532d">Data dostanu</text>
    <text x="745" y="150" text-anchor="middle" font-size="13" fill="#166534">RDF, JSON-LD, ontologie, SPARQL</text>
    <text x="564" y="181" font-size="14" fill="#16a34a">+ stabilní a strojově čitelné</text>
    <text x="564" y="206" font-size="14" fill="#16a34a">+ data nesou i svůj význam</text>
    <text x="564" y="231" font-size="14" fill="#dc2626">− jen tam, kde to někdo publikoval</text>
    <text x="745" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">přednáška 2 &#8211; příště</text>
  </g>

  <text x="500" y="308" text-anchor="middle" font-size="16" font-style="italic" fill="#4b5563">Dva protipóly téhož problému: násilím to jde vždycky, dohodou to vydrží.</text>
</svg>
