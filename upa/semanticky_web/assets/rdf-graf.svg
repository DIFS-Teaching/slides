  <g>
    <ellipse cx="560" cy="360" rx="120" ry="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="560" y="366" text-anchor="middle" font-family="monospace" font-size="14" fill="#14532d">foaf:Person</text>
