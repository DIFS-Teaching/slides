<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1000 330" width="1000" height="330"
     font-family="sans-serif" font-size="14" fill="#1f2937"
     version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 1. Získání dat - zvýrazněno, dnešní přednáška -->
  <text x="112" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#0284c7">dnes jsme tady</text>
  <g>
    <rect x="30" y="50" width="165" height="100" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
    <text x="112" y="78" text-anchor="middle" font-weight="bold" font-size="16" fill="#0c4a6e">Získání dat</text>
    <text x="112" y="101" text-anchor="middle" font-size="12" fill="#0369a1">web scraping,</text>
    <text x="112" y="118" text-anchor="middle" font-size="12" fill="#0369a1">propojená data (RDF)</text>
    <text x="112" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">přednášky 1, 2</text>
  </g>
  <line x1="197" y1="100" x2="217" y2="100" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2. Porozumění datům -->
  <g>
    <rect x="219" y="50" width="165" height="100" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="301" y="78" text-anchor="middle" font-weight="bold" font-size="16" fill="#64748b">Porozumění datům</text>
    <text x="301" y="101" text-anchor="middle" font-size="12" fill="#94a3b8">popisné charakteristiky,</text>
    <text x="301" y="118" text-anchor="middle" font-size="12" fill="#94a3b8">vizualizace, korelace</text>
    <text x="301" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">přednáška 3</text>
  </g>
  <line x1="386" y1="100" x2="406" y2="100" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3. Čištění a integrace - cíl zpětné šipky -->
  <g>
    <rect x="408" y="50" width="165" height="100" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="490" y="78" text-anchor="middle" font-weight="bold" font-size="16" fill="#64748b">Čištění a integrace</text>
    <text x="490" y="101" text-anchor="middle" font-size="12" fill="#94a3b8">chybějící hodnoty,</text>
    <text x="490" y="118" text-anchor="middle" font-size="12" fill="#94a3b8">duplicity, více zdrojů</text>
    <text x="490" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">přednáška 4</text>
  </g>
  <line x1="575" y1="100" x2="595" y2="100" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4. Redukce a transformace -->
  <g>
    <rect x="597" y="50" width="165" height="100" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="679" y="72" text-anchor="middle" font-weight="bold" font-size="16" fill="#64748b">Redukce a</text>
    <text x="679" y="91" text-anchor="middle" font-weight="bold" font-size="16" fill="#64748b">transformace</text>
    <text x="679" y="113" text-anchor="middle" font-size="12" fill="#94a3b8">dimenze, nevyváženost,</text>
    <text x="679" y="128" text-anchor="middle" font-size="12" fill="#94a3b8">kódování hodnot</text>
    <text x="679" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">přednáška 5</text>
  </g>
  <line x1="764" y1="100" x2="784" y2="100" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Mimo UPA: modelování -->
  <g>
    <rect x="786" y="50" width="165" height="100" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="868" y="78" text-anchor="middle" font-weight="bold" font-size="16" fill="#6b7280">Modelování</text>
    <text x="868" y="101" text-anchor="middle" font-size="12" fill="#6b7280">získávání znalostí,</text>
    <text x="868" y="118" text-anchor="middle" font-size="12" fill="#6b7280">strojové učení</text>
    <text x="868" y="140" text-anchor="middle" font-size="12" font-style="italic" fill="#9ca3af">ZZN, SFC, SUI</text>
  </g>

  <!-- Zpětná (čárkovaná) šipka: co uděláme dnes, ušetří práci ve 4. přednášce -->
  <path d="M 112 152 L 112 198 L 490 198 L 490 154"
        fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrg)"/>
  <text x="301" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">globální identifikátory tu ušetří práci</text>

  <!-- Rozsah UPA -->
  <path d="M 30 236 L 30 248 L 762 248 L 762 236" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text x="396" y="272" text-anchor="middle" font-weight="bold" font-size="17" fill="#0c4a6e">první polovina UPA</text>
  <text x="396" y="294" text-anchor="middle" font-size="14" fill="#0369a1">60 až 80 % reálného času práce s daty</text>
  <path d="M 786 236 L 786 248 L 951 248 L 951 236" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <text x="868" y="270" text-anchor="middle" font-size="14" font-style="italic" fill="#6b7280">jiné předměty</text>
</svg>
