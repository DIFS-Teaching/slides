<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1000 250" width="1000" height="250"
     font-family="sans-serif" font-size="14" fill="#1f2937"
     version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Subjekt -->
  <g>
    <ellipse cx="170" cy="110" rx="140" ry="46" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="170" y="102" text-anchor="middle" font-family="monospace" font-size="14" fill="#0c4a6e">https://dokumenty.cz/</text>
    <text x="170" y="122" text-anchor="middle" font-family="monospace" font-size="14" fill="#0c4a6e">clanek42</text>
  </g>
  <text x="170" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#0284c7">subjekt</text>
  <text x="170" y="206" text-anchor="middle" font-size="13" font-style="italic" fill="#0369a1">o čem mluvím</text>

  <!-- Predikát -->
  <line x1="315" y1="110" x2="675" y2="110" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="380" y="84" width="230" height="30" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="495" y="105" text-anchor="middle" font-family="monospace" font-size="15" fill="#374151">dcterms:creator</text>
  <text x="495" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#4b5563">predikát</text>
  <text x="495" y="206" text-anchor="middle" font-size="13" font-style="italic" fill="#6b7280">co o tom tvrdím</text>

  <!-- Objekt -->
  <g>
    <ellipse cx="820" cy="110" rx="140" ry="46" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="820" y="102" text-anchor="middle" font-family="monospace" font-size="14" fill="#14532d">https://lide.cz/</text>
    <text x="820" y="122" text-anchor="middle" font-family="monospace" font-size="14" fill="#14532d">jan-novak</text>
  </g>
  <text x="820" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">objekt</text>
  <text x="820" y="206" text-anchor="middle" font-size="13" font-style="italic" fill="#166534">hodnota nebo jiný zdroj</text>

  <text x="500" y="42" text-anchor="middle" font-size="17" font-weight="bold" fill="#374151">&#8222;Článek 42 má autora Jana Nováka.&#8220;</text>
</svg>
