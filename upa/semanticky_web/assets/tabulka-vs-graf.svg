<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1000 400" width="1000" height="400"
     font-family="sans-serif" font-size="14" fill="#1f2937"
     version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="240" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">Relační model</text>
  <text x="740" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">Graf (RDF)</text>

  <!-- ==== Levá strana: dvě tabulky s cizím klíčem ==== -->
  <!-- Tabulka Mesto -->
  <text x="60" y="62" font-size="13" font-style="italic" fill="#64748b">Mesto</text>
  <rect x="55" y="70" width="170" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="115" y1="70" x2="115" y2="160" stroke="#0284c7" stroke-width="1.5"/>
  <text x="66" y="90" font-family="monospace" font-size="13" font-weight="bold" fill="#0c4a6e">id</text>
  <text x="126" y="90" font-family="monospace" font-size="13" font-weight="bold" fill="#0c4a6e">nazev</text>
  <rect x="55" y="100" width="170" height="30" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="66" y="120" font-family="monospace" font-size="13" fill="#1f2937">17</text>
  <text x="126" y="120" font-family="monospace" font-size="13" fill="#1f2937">Brno</text>
  <rect x="55" y="130" width="170" height="30" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="66" y="150" font-family="monospace" font-size="13" fill="#1f2937">18</text>
  <text x="126" y="150" font-family="monospace" font-size="13" fill="#1f2937">Praha</text>

  <!-- Tabulka Kraj -->
  <text x="270" y="62" font-size="13" font-style="italic" fill="#64748b">Okres</text>
  <rect x="265" y="70" width="200" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="325" y1="70" x2="325" y2="130" stroke="#0284c7" stroke-width="1.5"/>
  <text x="276" y="90" font-family="monospace" font-size="13" font-weight="bold" fill="#0c4a6e">id</text>
  <text x="336" y="90" font-family="monospace" font-size="13" font-weight="bold" fill="#0c4a6e">nazev</text>
  <rect x="265" y="100" width="200" height="30" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="276" y="120" font-family="monospace" font-size="13" fill="#1f2937">3</text>
  <text x="336" y="120" font-family="monospace" font-size="13" fill="#1f2937">Brno-město</text>

  <!-- Vazební sloupec -->
  <text x="60" y="196" font-size="13" font-style="italic" fill="#64748b">Mesto.okres_id &#8211; cizí klíč</text>
  <rect x="55" y="204" width="170" height="30" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="66" y="224" font-family="monospace" font-size="13" fill="#713f12">17 &#8594; 3</text>

  <path d="M 228 219 L 300 219 L 300 134" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <text x="255" y="278" text-anchor="middle" font-size="14" fill="#4b5563">Vztah není v datech &#8211; je ve <tspan font-weight="bold">schématu</tspan></text>
  <text x="255" y="300" text-anchor="middle" font-size="14" fill="#4b5563">a vytáhne se až JOINem.</text>
  <text x="255" y="326" text-anchor="middle" font-size="13" font-style="italic" fill="#94a3b8">id = 17 platí jen uvnitř téhle databáze.</text>

  <!-- Dělicí čára -->
  <line x1="500" y1="40" x2="500" y2="350" stroke="#cbd5e1" stroke-width="2"/>

  <!-- ==== Pravá strana: graf ==== -->
  <g>
    <ellipse cx="620" cy="110" rx="78" ry="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="620" y="115" text-anchor="middle" font-family="monospace" font-size="13" fill="#14532d">wd:Q14960</text>
    
  </g>
  <g>
    <ellipse cx="880" cy="110" rx="78" ry="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="880" y="115" text-anchor="middle" font-family="monospace" font-size="13" fill="#14532d">wd:Q850531</text>
    
  </g>
  <line x1="700" y1="110" x2="798" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="749" y="100" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">wdt:P131</text>

  <g>
    <rect x="552" y="190" width="136" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="620" y="213" text-anchor="middle" font-family="monospace" font-size="13" fill="#14532d">"Brno"@cs</text>
  </g>
  <line x1="620" y1="141" x2="620" y2="186" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="630" y="168" font-family="monospace" font-size="12" fill="#166534">rdfs:label</text>

  <g>
    <rect x="812" y="190" width="136" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="880" y="213" text-anchor="middle" font-family="monospace" font-size="12" fill="#14532d">"Brno-město"@cs</text>
  </g>
  <line x1="880" y1="141" x2="880" y2="186" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="890" y="168" font-family="monospace" font-size="12" fill="#166534">rdfs:label</text>

  <text x="750" y="278" text-anchor="middle" font-size="14" fill="#4b5563">Vztah je jedna z trojic &#8211; stejně</text>
  <text x="750" y="300" text-anchor="middle" font-size="14" fill="#4b5563">plnohodnotné datum jako název.</text>
  <text x="750" y="326" text-anchor="middle" font-size="13" font-style="italic" fill="#94a3b8">wd:Q14960 platí na celém webu.</text>

  <text x="500" y="376" text-anchor="middle" font-size="16" font-style="italic" fill="#4b5563">Tatáž tři fakta. Vlevo je vztah JOIN, vpravo je vztah datum.</text>
</svg>
