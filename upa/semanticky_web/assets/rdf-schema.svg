<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1000 400" width="1000" height="400"
     font-family="sans-serif" font-size="14" fill="#1f2937"
     version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Pásmo schématu -->
  <rect x="30" y="20" width="940" height="160" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="52" y="46" font-size="15" font-weight="bold" font-style="italic" fill="#6d28d9">schéma (ontologie)</text>

  <g>
    <ellipse cx="700" cy="70" rx="120" ry="32" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="700" y="76" text-anchor="middle" font-family="monospace" font-size="15" fill="#4c1d95">foaf:Agent</text>
  </g>
  <g>
    <ellipse cx="700" cy="148" rx="120" ry="32" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="700" y="154" text-anchor="middle" font-family="monospace" font-size="15" fill="#4c1d95">foaf:Person</text>
  </g>
  <line x1="700" y1="116" x2="700" y2="106" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <text x="716" y="118" font-family="monospace" font-size="14" fill="#4c1d95">rdfs:subClassOf</text>

  <g>
    <ellipse cx="220" cy="148" rx="120" ry="32" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="220" y="154" text-anchor="middle" font-family="monospace" font-size="15" fill="#4c1d95">bibo:Article</text>
  </g>

  <!-- Pásmo dat -->
  <rect x="30" y="220" width="940" height="150" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="52" y="246" font-size="15" font-weight="bold" font-style="italic" fill="#0369a1">data (instance)</text>

  <g>
    <ellipse cx="220" cy="310" rx="130" ry="36" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="220" y="316" text-anchor="middle" font-family="monospace" font-size="14" fill="#0c4a6e">doc:clanek42</text>
  </g>
  <g>
    <ellipse cx="700" cy="310" rx="130" ry="36" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="700" y="316" text-anchor="middle" font-family="monospace" font-size="14" fill="#0c4a6e">lide:jan-novak</text>
  </g>
  <line x1="352" y1="310" x2="566" y2="310" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <text x="459" y="300" text-anchor="middle" font-family="monospace" font-size="14" fill="#374151">dcterms:creator</text>

  <!-- rdf:type propojuje obě pásma -->
  <line x1="220" y1="272" x2="220" y2="186" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <text x="234" y="230" font-family="monospace" font-size="14" fill="#4c1d95">rdf:type</text>
  <line x1="700" y1="272" x2="700" y2="186" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <text x="714" y="230" font-family="monospace" font-size="14" fill="#4c1d95">rdf:type</text>

  <text x="500" y="392" text-anchor="middle" font-size="15" font-style="italic" fill="#4b5563">Schéma je psané týmiž trojicemi jako data &#8211; jen o patro výš.</text>
</svg>
