<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1000 400" width="1000" height="400"
     font-family="sans-serif" font-size="14" fill="#1f2937"
     version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">Tři řádky ze tří různých zdrojů</text>

  <!-- Tři nascrapované řádky -->
  <g>
    <rect x="60" y="46" width="880" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="80" y="74" font-family="monospace" font-size="17" fill="#0c4a6e">"Vysoké učení technické v Brně"</text>
    <text x="700" y="74" font-family="monospace" font-size="15" fill="#0369a1">Brno</text>
    <text x="920" y="74" text-anchor="end" font-size="12" font-style="italic" fill="#0369a1">scraper e-shopu</text>
  </g>
  <g>
    <rect x="60" y="100" width="880" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="80" y="128" font-family="monospace" font-size="17" fill="#0c4a6e">"VUT v Brně"</text>
    <text x="700" y="128" font-family="monospace" font-size="15" fill="#0369a1">Brno-střed</text>
    <text x="920" y="128" text-anchor="end" font-size="12" font-style="italic" fill="#0369a1">registr smluv</text>
  </g>
  <g>
    <rect x="60" y="154" width="880" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="80" y="182" font-family="monospace" font-size="17" fill="#0c4a6e">"Brno University of Technology"</text>
    <text x="700" y="182" font-family="monospace" font-size="15" fill="#0369a1">Czechia</text>
    <text x="920" y="182" text-anchor="end" font-size="12" font-style="italic" fill="#0369a1">publikační databáze</text>
  </g>

  <!-- Sbíhající se šipky -->
  <path d="M 500 202 L 500 232" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Jeden identifikátor -->
  <g>
    <rect x="250" y="240" width="500" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="500" y="277" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#14532d">IČO 00216305</text>
  </g>

  <path d="M 500 300 L 500 324" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="210" y="332" width="580" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="500" y="360" text-anchor="middle" font-family="monospace" font-size="17" fill="#4c1d95">wd:Q1122171</text>
  </g>
