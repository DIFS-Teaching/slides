<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1000 185" width="1000" height="185"
     font-family="sans-serif" font-size="14" fill="#1f2937"
     version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="25" width="200" height="95" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="140" y="52" text-anchor="middle" font-weight="bold" font-size="16" fill="#0c4a6e">Propojená data, RDF</text>
    <text x="140" y="76" text-anchor="middle" font-size="12" fill="#0369a1">graf jako způsob</text>
    <text x="140" y="92" text-anchor="middle" font-size="12" fill="#0369a1">výměny dat a významu</text>
    <text x="140" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">přednáška 2</text>
  </g>
  <line x1="242" y1="72" x2="278" y2="72" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="280" y="25" width="200" height="95" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="52" text-anchor="middle" font-weight="bold" font-size="16" fill="#14532d">Grafové databáze</text>
    <text x="380" y="76" text-anchor="middle" font-size="12" fill="#166534">graf jako úložiště</text>
    <text x="380" y="92" text-anchor="middle" font-size="12" fill="#166534">a předmět dotazu</text>
    <text x="380" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">přednáška 9</text>
  </g>
  <line x1="482" y1="72" x2="518" y2="72" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="520" y="25" width="200" height="95" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="620" y="45" text-anchor="middle" font-weight="bold" font-size="16" fill="#14532d">Vícedimenzionální</text>
    <text x="620" y="64" text-anchor="middle" font-weight="bold" font-size="16" fill="#14532d">indexy</text>
    <text x="620" y="87" text-anchor="middle" font-size="12" fill="#166534">podobnost místo rovnosti</text>
    <text x="620" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">přednáška 13</text>
  </g>
  <line x1="722" y1="72" x2="758" y2="72" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="760" y="25" width="200" height="95" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="860" y="45" text-anchor="middle" font-weight="bold" font-size="16" fill="#4c1d95">Knowledge grafy</text>
    <text x="860" y="64" text-anchor="middle" font-weight="bold" font-size="16" fill="#4c1d95">a RAG nad LLM</text>
    <text x="860" y="87" text-anchor="middle" font-size="12" fill="#6d28d9">to, co se dnes staví</text>
    <text x="860" y="112" text-anchor="middle" font-size="12" font-style="italic" fill="#7c3aed">vaše diplomka?</text>
  </g>

  <text x="500" y="158" text-anchor="middle" font-size="15" font-style="italic" fill="#4b5563">Jedna linka, která prochází celým semestrem &#8211; a končí u toho, co se dnes reálně staví.</text>
</svg>
